name: Upload checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.26,<2" "Pillow>=10,<12" "Flask>=3,<4" "pytest>=8,<10"
      - run: python -m pytest -q
